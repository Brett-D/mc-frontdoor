name: Release

# Push a tag like v0.1.0 (matching the version in Cargo.toml) to publish binaries and the Docker image.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Keep buildx build records out of the run's artifacts (and so out of the release).
env:
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"; exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --locked
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install "httpx[http2]"
      - run: python tests/e2e.py target/debug/mc-frontdoor

  linux:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Static binaries for x86_64 and aarch64
        uses: docker/build-push-action@v7
        with:
          context: .
          target: binaries
          platforms: linux/amd64,linux/arm64
          outputs: type=local,dest=out
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: mkdir -p assets && cp out/*/mc-frontdoor-* assets/ && ls -l assets
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: assets/*

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: |
          mkdir assets
          copy target\release\mc-frontdoor.exe assets\mc-frontdoor-x86_64-windows.exe
        shell: cmd
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: assets/*

  image:
    # Only once the binaries built, so a failed release doesn't leave a new "latest" image behind.
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [linux, windows, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          pattern: release-*
          merge-multiple: true
      - run: cd assets && sha256sum mc-frontdoor-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true
